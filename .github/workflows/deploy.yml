# Deploy demo lên Vercel từ GitHub: build trên máy GitHub (máy build gói Hobby của Vercel thiếu RAM) rồi đẩy bản đã build.
# Chạy khi push lên main, khi requirement QC vừa cập nhật (requirements.yml gọi), hoặc bấm tay.
# Cần secret VERCEL_TOKEN (vercel.com → Account Settings → Tokens).
name: Deploy demo

on:
  push:
    branches: [main]
    paths-ignore: ["qc/**", ".figma/**"]
  workflow_call:
  workflow_dispatch:

# Queue, never cancel: a push and requirements.yml can both ask for a deploy; a cancelled run kills the other's build.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VERCEL_ORG_ID: team_sFEtj8U8fk5SoT0J4eNhlqEX
      VERCEL_PROJECT_ID: prj_uuVtVRFOVUGPxz7YkCEI4d491c6P
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - name: Need VERCEL_TOKEN
        if: env.VERCEL_TOKEN == ''
        run: |
          echo "::error::Chưa có secret VERCEL_TOKEN, bỏ qua deploy."
          exit 1

      # The runner has 7GB RAM; next build of ~930 pages peaks above it and the runner is killed mid-build.
      - name: Add swap
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 12G /swapfile2 && sudo chmod 600 /swapfile2
          sudo mkswap /swapfile2 && sudo swapon /swapfile2
          free -h

      - uses: actions/checkout@v4
        with:
          ref: main # requirements.yml vừa commit lên main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: |
          npx vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy
        run: npx vercel deploy --prebuilt --prod --archive=tgz --token="$VERCEL_TOKEN"
