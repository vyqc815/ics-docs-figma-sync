# Deploy demo lên Vercel từ GitHub: build trên máy GitHub (máy build gói Hobby của Vercel thiếu RAM) rồi đẩy bản đã build.
# Gộp deploy 3 lượt/ngày (9h, 13h, 17h giờ VN, thứ 2–7) để giữ phút Actions miễn phí: lượt nào main không có
# commit mới từ lần deploy thành công trước thì bỏ qua (~1 phút). Cần gấp thì bấm "Run workflow".
# Cần secret VERCEL_TOKEN (vercel.com → Account Settings → Tokens).
name: Deploy demo

on:
  schedule:
    - cron: "0 2,6,10 * * 1-6"
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# Queue, never cancel: a cancelled run kills the other's build.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      deploy: ${{ steps.check.outputs.deploy }}
    steps:
      - name: Anything new since the last deploy?
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh run list -R "$GITHUB_REPOSITORY" -w "Deploy demo" -s success -L 1 --json headSha -q '.[0].headSha')
          head=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" -q .sha)
          echo "lần deploy trước: $last · main: $head"
          # files the hub reads live from GitHub (sync marks, Figma change log, accounts, projects) need no deploy
          other=yes
          if [ -n "$last" ] && [ "$last" != "$head" ] && list=$(gh api "repos/$GITHUB_REPOSITORY/compare/$last...$head" -q '.files[].filename'); then
            other=$(echo "$list" | grep -vE '^docs/(dong-bo|hub|du-an)/' | head -1)
          fi
          if [ "${{ github.event_name }}" = "schedule" ] && { [ "$last" = "$head" ] || [ -z "$other" ]; }; then
            echo "Không có gì mới, bỏ qua."; echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: news
    # repo variable DEPLOY_TARGET: empty/vercel = Vercel only, server = company server only, both = both
    if: needs.news.outputs.deploy == 'true' && vars.DEPLOY_TARGET != 'server'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      sha: ${{ steps.built.outputs.sha }}
    env:
      VERCEL_ORG_ID: team_sFEtj8U8fk5SoT0J4eNhlqEX
      VERCEL_PROJECT_ID: prj_uuVtVRFOVUGPxz7YkCEI4d491c6P
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - name: Need VERCEL_TOKEN
        if: env.VERCEL_TOKEN == ''
        run: |
          echo "::error::Chưa có secret VERCEL_TOKEN, bỏ qua deploy."
          exit 1

      # The runner has 7GB RAM; next build of ~930 pages peaks above it and the runner is killed mid-build.
      - name: Add swap
        run: |
          # free disk first (unused preinstalled SDKs); a 12GB swap on the stock disk filled it and killed the runner
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo swapoff -a || true
          sudo rm -f /swapfile /mnt/swapfile
          sudo fallocate -l 8G /swapfile2 && sudo chmod 600 /swapfile2
          sudo mkswap /swapfile2 && sudo swapon /swapfile2
          free -h && df -h /

      - uses: actions/checkout@v4
        with:
          ref: main # requirements.yml có thể vừa commit lên main

      - id: built
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Next keeps compiled pages in .next/cache: a rebuild only redoes what changed (~20 → ~6–8 minutes).
      - name: Restore build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: next-${{ hashFiles('package-lock.json') }}-

      - name: Build
        run: |
          npx vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy
        run: npx vercel deploy --prebuilt --prod --archive=tgz --token="$VERCEL_TOKEN"

  # Company server icstestsapi.pls.edu.vn/docs-figma (docs/he-thong-ma/trien-khai-server.md). No root needed: the
  # hub, with its own Node binary, goes to /opt/docs-figma/hub over rsync; the existing service "docs-figma" (port
  # and nginx route already set up for the old docs site) starts it instead of MkDocs. Old launcher kept for rollback.
  # Secrets: DEPLOY_HOST/USER/SSH_KEY(/PORT), HUB_QC_WEB_PASSWORD, HUB_GITHUB_WRITE_TOKEN, FIGMA_ACCESS_TOKEN.
  # Variables: DEPLOY_TARGET=server|both, HUB_BASE_PATH=/docs-figma.
  server:
    needs: news
    if: needs.news.outputs.deploy == 'true' && (vars.DEPLOY_TARGET == 'server' || vars.DEPLOY_TARGET == 'both')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      sha: ${{ steps.built.outputs.sha }}
    steps:
      - name: Add swap
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo swapoff -a || true
          sudo rm -f /swapfile /mnt/swapfile
          sudo fallocate -l 8G /swapfile2 && sudo chmod 600 /swapfile2
          sudo mkswap /swapfile2 && sudo swapon /swapfile2

      - uses: actions/checkout@v4
        with:
          ref: main

      - id: built
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Restore build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-server-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: next-server-${{ hashFiles('package-lock.json') }}-

      - name: Build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ vars.HUB_BASE_PATH }}
          # first build without cache (930 screens + standalone tracing) passes Node's ~4GB default heap
          NODE_OPTIONS: --max-old-space-size=10240
        run: |
          node scripts/figma/copy-refs.mjs
          node scripts/figma/base-path.mjs
          NEXT_OUTPUT=standalone npx next build
          cp -r public .next/standalone/
          cp -r .next/static .next/standalone/.next/
          # the server has no Node: ship the same version the build used
          v=$(node -v)
          curl -fsSL "https://nodejs.org/dist/$v/node-$v-linux-x64.tar.xz" | tar xJ -C "$RUNNER_TEMP"
          mkdir -p .next/standalone/.node && cp "$RUNNER_TEMP/node-$v-linux-x64/bin/node" .next/standalone/.node/node
          du -sh .next/standalone

      - name: Copy and switch
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          QC_WEB_PASSWORD: ${{ secrets.HUB_QC_WEB_PASSWORD }}
          GITHUB_WRITE_TOKEN: ${{ secrets.HUB_GITHUB_WRITE_TOKEN }}
          FIGMA_ACCESS_TOKEN: ${{ secrets.FIGMA_ACCESS_TOKEN }}
        run: |
          [ -n "$QC_WEB_PASSWORD" ] || { echo "::error::Thiếu secret HUB_QC_WEB_PASSWORD"; exit 1; }
          mkdir -p ~/.ssh && echo "$SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          ssh_cmd="ssh -i $HOME/.ssh/id_deploy -o StrictHostKeyChecking=accept-new -p ${PORT:-22}"
          H=/opt/docs-figma/hub
          rel="$H/releases/${GITHUB_SHA::12}"
          $ssh_cmd "$USER@$HOST" "mkdir -p $H/staging $H/releases"
          # ~1.3GB (930 prerendered demo screens, images, generated code): rsync sends only what changed
          rsync -az --delete -e "$ssh_cmd" .next/standalone/ "$USER@$HOST:$H/staging/"
          # secrets go over stdin into a file only this user reads, never on a command line
          printf 'QC_WEB_PASSWORD=%s\nGITHUB_WRITE_TOKEN=%s\nFIGMA_ACCESS_TOKEN=%s\nGITHUB_REPO=%s\n' \
            "$QC_WEB_PASSWORD" "$GITHUB_WRITE_TOKEN" "$FIGMA_ACCESS_TOKEN" "$GITHUB_REPOSITORY" \
            | $ssh_cmd "$USER@$HOST" "umask 077 && cat > $H/.env"
          $ssh_cmd "$USER@$HOST" bash -s <<EOS
          set -e
          rm -rf $rel && cp -al $H/staging $rel        # hard links: a full release in seconds
          ln -sfn $rel $H/current
          # launcher: port from the old site's .env (nginx /docs-figma already points there)
          cat > $H/start.sh <<'SH'
          #!/bin/bash
          set -a; . /opt/docs-figma/app/.env; . /opt/docs-figma/hub/.env; set +a
          cd /opt/docs-figma/hub/current
          export NODE_ENV=production HOSTNAME=127.0.0.1 PORT="\${PORT:-8030}"
          # BA docs (branch stable) the BE deploy keeps on this server; the old site linked app/docs to it.
          # The hub syncs them into qc/requirements every 5 minutes (lib/qc/ba-sync.ts).
          [ -r /opt/docs-figma/app/docs/ ] && export DOCS_BA_DIR=/opt/docs-figma/app/docs/
          exec ./.node/node server.js
          SH
          chmod +x $H/start.sh
          app=/opt/docs-figma/app/scripts
          [ -f \$app/dev.sh.mkdocs ] || cp \$app/dev.sh \$app/dev.sh.mkdocs   # keep the old launcher once
          printf '#!/bin/bash\n# QC Hub thay web MkDocs. Quay lại web cũ: cp dev.sh.mkdocs dev.sh && sudo systemctl restart docs-figma\nexec /opt/docs-figma/hub/start.sh\n' > \$app/dev.sh
          chmod +x \$app/dev.sh
          sudo systemctl restart docs-figma
          ok=0
          for i in 1 2 3 4 5 6 7 8; do sleep 5; curl -fsS -o /dev/null http://127.0.0.1:8030/docs-figma/hub/dang-nhap && { ok=1; break; }; done
          if [ \$ok = 1 ]; then echo "Hub chạy rồi"; else
            # never leave /docs-figma down: back to the old docs site, fail the job
            cp \$app/dev.sh.mkdocs \$app/dev.sh && sudo systemctl restart docs-figma
            journalctl -u docs-figma -n 30 --no-pager 2>/dev/null || true
            echo "Hub không lên, đã trả lại web cũ"; exit 1
          fi
          ls -1dt $H/releases/* | tail -n +4 | xargs -r rm -rf     # keep 3 releases
          EOS

  # The hub now shows the new requirements: tell developers whose screens changed after they marked them
  # (scripts/figma/notify-devs.mjs --docs, webhooks set on Hub › Tài khoản). Compares the docs that were deployed,
  # the company server's build first. Never fails the deploy.
  notify-devs:
    needs: [news, deploy, server]
    if: always() && needs.news.outputs.deploy == 'true' && (needs.deploy.result == 'success' || needs.server.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.server.outputs.sha || needs.deploy.outputs.sha }}
          sparse-checkout: |
            scripts/figma
            docs/requirements
            docs/dong-bo
            docs/he-thong-ma

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Notify developers
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HUB_URL: ${{ vars.HUB_URL }}
        run: node scripts/figma/notify-devs.mjs --docs
