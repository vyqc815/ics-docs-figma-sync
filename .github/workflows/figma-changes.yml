# Báo màn Figma đã đổi vào Google Chat.
# Quét mỗi giờ từ 7h đến 19h giờ Việt Nam (thứ 2–7), hoặc bấm tay. Không dùng webhook Figma (cần gói trả phí).
# Figma chưa sửa thì dừng sau 1 request (~1 phút Actions). Gần chạm 1.800 phút/tháng thì chỉ quét 4 giờ/lần và báo Chat.
# Mốc so sánh giữ trong cache của Actions; cache mất thì lượt sau chỉ lưu mốc mới, không báo.
name: Figma changes

on:
  schedule:
    - cron: "0 0-12 * * 1-6"
  workflow_dispatch:
    inputs:
      test:
        description: "Chỉ gửi một tin thử vào Google Chat"
        type: boolean
        default: false

permissions:
  contents: write   # ghi docs/dong-bo/figma-doi.json (màn nào đổi lúc nào) cho trạng thái đồng bộ trên Hub
  actions: read

concurrency:
  group: figma-changes
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            figma.pages.json
            scripts/figma
            docs/dong-bo
            docs/he-thong-ma
            docs/du-an

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Gần chạm quota miễn phí: chỉ quét lúc 7h, 11h, 15h, 19h và nhắc vào Chat lúc 7h.
      - name: Actions minutes
        id: quota
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/figma/actions-minutes.mjs
          hour=$(date -u +%H)
          if grep -q "tight=true" "$GITHUB_OUTPUT" && [ "${{ github.event_name }}" = "schedule" ] && [ $((10#$hour % 4)) != 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Warn about quota
        if: steps.quota.outputs.tight == 'true' && github.event_name == 'schedule' && steps.quota.outputs.skip != 'true'
        env:
          GOOGLE_CHAT_WEBHOOK_URL: ${{ secrets.GOOGLE_CHAT_WEBHOOK_URL }}
        run: |
          [ "$(date -u +%H)" = "00" ] || exit 0
          node -e '
            const u = new URL(process.env.GOOGLE_CHAT_WEBHOOK_URL);
            u.searchParams.set("threadKey", "figma-ICS"); u.searchParams.set("messageReplyOption", "REPLY_MESSAGE_FALLBACK_TO_NEW_THREAD");
            fetch(u, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text:
              "*[ICS] Sắp hết phút GitHub Actions miễn phí tháng này* (~${{ steps.quota.outputs.minutes }} phút). Báo Figma giãn còn 4 giờ/lần tới đầu tháng." }) });'

      - name: Restore snapshot
        if: steps.quota.outputs.skip != 'true'
        uses: actions/cache/restore@v4
        with:
          path: .figma/pages/snapshot.json
          key: figma-snapshot-${{ github.run_id }}
          restore-keys: figma-snapshot-

      - name: Compare and notify
        if: steps.quota.outputs.skip != 'true'
        id: notify
        env:
          FIGMA_ACCESS_TOKEN: ${{ secrets.FIGMA_ACCESS_TOKEN }}
          GOOGLE_CHAT_WEBHOOK_URL: ${{ secrets.GOOGLE_CHAT_WEBHOOK_URL }}
          FIGMA_PROJECT: ICS
          CHAT_TEST: ${{ inputs.test == true }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set +e
          node scripts/figma/notify-changes.mjs
          code=$?
          # 3 = có màn đổi và đã báo; không phải lỗi.
          if [ "$code" = 3 ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          exit $code

      - name: Save snapshot
        if: hashFiles('.figma/pages/snapshot.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .figma/pages/snapshot.json
          key: figma-snapshot-${{ github.run_id }}

      # Dự án thêm từ Hub (docs/du-an/projects.json): mỗi dự án một mốc, ghi docs/du-an/<slug>/figma-doi.json.
      - name: Restore snapshots of hub projects
        if: steps.quota.outputs.skip != 'true'
        uses: actions/cache/restore@v4
        with:
          path: .figma/live
          key: figma-live-${{ github.run_id }}
          restore-keys: figma-live-

      - name: Hub projects
        if: steps.quota.outputs.skip != 'true' && inputs.test != true
        id: live
        continue-on-error: true
        env:
          FIGMA_ACCESS_TOKEN: ${{ secrets.FIGMA_ACCESS_TOKEN }}
          GOOGLE_CHAT_WEBHOOK_URL: ${{ secrets.GOOGLE_CHAT_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set +e
          node scripts/figma/live-changes.mjs
          code=$?
          if [ "$code" = 3 ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          exit $code

      - name: Save snapshots of hub projects
        if: hashFiles('.figma/live/*.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .figma/live
          key: figma-live-${{ github.run_id }}

      - name: Log changed screens
        if: steps.notify.outputs.changed == 'true' || steps.live.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/dong-bo/figma-doi.json docs/du-an
          git diff --cached --quiet && exit 0
          git commit -m "Đồng bộ: ghi màn Figma vừa đổi"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done
          exit 1

      # Dev đã đánh dấu Đang làm / Xong màn nào mà Figma đổi sau đó: nhắn webhook của dev + dự án (Hub › Tài khoản).
      - name: Notify developers
        if: steps.quota.outputs.skip != 'true'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HUB_URL: ${{ vars.HUB_URL }}
        run: node scripts/figma/notify-devs.mjs

      - name: Keep full report
        if: steps.notify.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: figma-changes
          path: figma-changes.md
          retention-days: 30
