# Gửi một tin vào Google Chat từ Hub (VD: "Gửi cho design" ở trang Đề xuất mã). Hub không giữ webhook, chỉ gọi workflow.
name: Tin nhắn Chat

on:
  workflow_dispatch:
    inputs:
      thread: { description: "Luồng (threadKey)", required: true }
      text: { description: "Nội dung", required: true }

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/he-thong-ma
      - env:
          GOOGLE_CHAT_WEBHOOK_URL: ${{ secrets.GOOGLE_CHAT_WEBHOOK_URL }}
          THREAD: ${{ inputs.thread }}
          TEXT: ${{ inputs.text }}
        run: python3 scripts/he-thong-ma/chat_text.py "$THREAD" "$TEXT"
