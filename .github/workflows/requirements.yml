# QC sửa bản gốc ở qc/requirements (GitHub web: sửa file .md, hoặc "Add file → Upload files" cho ảnh)
# → chuyển template, gắn mã, dựng registry (cap_nhat_requirement.py) → commit → deploy demo → báo Google Chat.
# Web QC đọc bản đã gắn mã qua /api/qc. Kiểm thiếu nội dung thì dừng, giữ bản cũ và báo lỗi.
name: Requirement QC

on:
  push:
    branches: [main]
    paths: ["qc/requirements/**"]
  workflow_dispatch:

concurrency:
  group: requirements
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    env:
      GOOGLE_CHAT_WEBHOOK_URL: ${{ secrets.GOOGLE_CHAT_WEBHOOK_URL }}
      FIGMA_PROJECT: ICS
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Convert and check
        id: run
        run: |
          set +e
          python3 scripts/he-thong-ma/cap_nhat_requirement.py qc/requirements --no-zip --summary "$RUNNER_TEMP/summary.md" > "$RUNNER_TEMP/run.log" 2>&1
          code=$?
          grep -v '^{"nguon' "$RUNNER_TEMP/run.log" | tail -80
          echo "ok=$([ "$code" = 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Commit
        id: commit
        if: steps.run.outputs.ok == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs scripts/figma/screen-requirements.json
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -m "Cập nhật requirement từ bản gốc QC (${GITHUB_SHA::7})"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "version=$(python3 -c 'import json;print(json.load(open("docs/he-thong-ma/qc-index.json"))["version"])')" >> "$GITHUB_OUTPUT"

      - name: Notify
        if: always()
        env:
          QC_VERSION: ${{ steps.commit.outputs.version }}
        run: |
          if [ "${{ steps.run.outputs.ok }}" != "true" ]; then python3 scripts/he-thong-ma/bao_chat.py loi "$RUNNER_TEMP/run.log"
          elif [ "${{ steps.commit.outputs.changed }}" = "true" ]; then python3 scripts/he-thong-ma/bao_chat.py ok "$RUNNER_TEMP/summary.md"
          else python3 scripts/he-thong-ma/bao_chat.py khong-doi; fi

      - name: Fail when stopped
        if: steps.run.outputs.ok != 'true'
        run: exit 1

  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
