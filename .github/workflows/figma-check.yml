name: Figma check

# Mỗi giờ SSH vào server rồi chạy kiểm tra Figma ngay trên đó, sau đó build lại site.
# Server đã có docs (repo BE) và FIGMA_TOKEN trong .env, nên Action không cần token repo docs hay token Figma.
# Dùng chung secrets với deploy.yml: DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY, DEPLOY_PORT (nếu SSH không ở port 22).
on:
  schedule: [{ cron: "0 * * * *" }]   # mỗi giờ
  workflow_dispatch:

concurrency: deploy   # không chạy chồng lúc đang deploy

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Kiểm tra Figma trên server
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          mkdir -p ~/.ssh && echo "$SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          ssh -i ~/.ssh/id_deploy -p "${PORT:-22}" -o StrictHostKeyChecking=accept-new "$USER@$HOST" '
            set -e
            cd /opt/docs-figma/app
            set -a; [ -f .env ] && . ./.env; set +a
            .venv/bin/python scripts/figma_check.py --thumbs
            .venv/bin/mkdocs build -q
          '
