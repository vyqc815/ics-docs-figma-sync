# Hub cần một tên miền con riêng (vd qchub.pls.edu.vn): app dùng đường dẫn gốc (/hub, /api, /figma, /frames…),
# không chạy được dưới /qc-hub/ của domain khác. Trỏ DNS tên miền con về server rồi thêm block này,
# cấp HTTPS bằng certbot: sudo certbot --nginx -d qchub.pls.edu.vn
server {
    listen 80;
    server_name qchub.pls.edu.vn;

    client_max_body_size 20m;            # sửa requirement dài, tải ảnh

    location / {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
