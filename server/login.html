<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đăng nhập · ICS Docs & Figma Sync</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --bg: #f3f4f7; --card: #fff; --fg: #0f172a; --muted: #64748b; --line: #e5e7eb; --accent: #2563eb; --danger: #dc2626; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0b1020; --card: #121a2e; --fg: #e5e7eb; --muted: #94a3b8; --line: #23304d; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
    background: var(--bg); color: var(--fg); font: 14px/1.5 Inter, system-ui, sans-serif; }
  .card { width: 100%; max-width: 380px; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 32px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 17px; margin-bottom: 24px; }
  .logo { width: 30px; height: 30px; border-radius: 9px; background: var(--accent); color: #fff; display: grid; place-items: center; font-size: 13px; }
  h1 { font-size: 22px; font-weight: 600; margin: 0 0 4px; }
  p { color: var(--muted); margin: 0 0 24px; }
  label { display: block; font-size: 13px; font-weight: 500; margin: 14px 0 6px; }
  input { width: 100%; height: 42px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line);
    background: transparent; color: var(--fg); font: inherit; outline: none; transition: border-color .15s, box-shadow .15s; }
  input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent); }
  button { width: 100%; height: 42px; margin-top: 22px; border: 0; border-radius: 10px; background: var(--accent);
    color: #fff; font: inherit; font-weight: 500; cursor: pointer; transition: filter .15s; }
  button:hover { filter: brightness(1.08); }
  button[disabled] { opacity: .7; cursor: wait; }
  .error { color: var(--danger); font-size: 13px; min-height: 20px; margin-top: 12px; }
</style>
</head>
<body>
  <form class="card" id="form" novalidate>
    <div class="brand"><span class="logo">ICS</span>Docs & Figma Sync</div>
    <h1>Đăng nhập</h1>
    <p>Xem requirement và UI Figma song song.</p>
    <label for="username">Tài khoản</label>
    <input id="username" autocomplete="username" autofocus>
    <label for="password">Mật khẩu</label>
    <input id="password" type="password" autocomplete="current-password">
    <button id="submit" type="submit">Đăng nhập</button>
    <div class="error" id="error" role="alert"></div>
  </form>
<script>
  var form = document.getElementById("form"), err = document.getElementById("error"), btn = document.getElementById("submit");
  form.addEventListener("input", function () { err.textContent = ""; });
  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var u = document.getElementById("username").value.trim(), p = document.getElementById("password").value;
    if (!u || !p) { err.textContent = "Nhập tài khoản và mật khẩu"; return; }
    btn.disabled = true;
    fetch("api/login", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username: u, password: p }) })
      .then(function (r) { return r.json(); })
      .then(function (res) {
        if (!res.ok) { err.textContent = res.message; btn.disabled = false; return; }
        var next = new URLSearchParams(location.search).get("next") || "./";
        location.href = next.charAt(0) === "/" && next.charAt(1) !== "/" ? next : "./";
      })
      .catch(function () { err.textContent = "Không kết nối được máy chủ"; btn.disabled = false; });
  });
</script>
</body>
</html>
